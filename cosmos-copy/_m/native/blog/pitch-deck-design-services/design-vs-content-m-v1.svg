<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1268" viewBox="0 0 800 1268" role="img" aria-labelledby="t d"><title id="t">Design gets you read. Content gets you funded.</title><desc id="d">Mobile version. Chart of the Blaseg and Mayer 2025 trial. Better design and better content each raised time spent by 35% and slides viewed by 12%; positive reactions rose 116% for design and 121% for content. Only better content raised the likelihood to invest.</desc><defs><style>@font-face{font-family:'InterSub';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'InterSub';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:InterSub,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6FB5"/><stop offset="0.5" stop-color="#FFB86B"/><stop offset="1" stop-color="#8FD8FF"/></linearGradient><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2B"/><stop offset="1" stop-color="#2B2B2B" stop-opacity="0"/></linearGradient></defs><rect width="800" height="1268" rx="28" fill="#F4F2EE"/><rect x="24" y="24" width="752" height="1220" rx="22" fill="#FFFFFF"/><text x="56" y="100" font-size="44" font-weight="600" fill="#141414" text-anchor="start">Design gets you read. Content</text><text x="56" y="152" font-size="44" font-weight="600" fill="#141414" text-anchor="start">gets you funded.</text><text x="56" y="202" font-size="30" font-weight="400" fill="#5E5B57" text-anchor="start">Blaseg and Mayer, 2025: randomized trial with</text><text x="56" y="242" font-size="30" font-weight="400" fill="#5E5B57" text-anchor="start">nearly 35,000 investors.</text><rect x="56.0" y="280.0" width="36.0" height="26.0" rx="6" fill="url(#g)"/><text x="106" y="304" font-size="28" font-weight="400" fill="#141414" text-anchor="start">Better design</text><rect x="326.4" y="280.0" width="36.0" height="26.0" rx="6" fill="#2B2B2B"/><text x="376.44921875" y="304" font-size="28" font-weight="400" fill="#141414" text-anchor="start">Better content</text><text x="56" y="392" font-size="30" font-weight="600" fill="#141414" text-anchor="start">Time spent on the deck</text><rect x="56.0" y="412.0" width="136.5" height="38.0" rx="9" fill="url(#g)"/><text x="206.5" y="442" font-size="30" font-weight="600" fill="#141414" text-anchor="start">+35%</text><rect x="56.0" y="462.0" width="136.5" height="38.0" rx="9" fill="#2B2B2B"/><text x="206.5" y="492" font-size="30" font-weight="600" fill="#141414" text-anchor="start">+35%</text><text x="56" y="582" font-size="30" font-weight="600" fill="#141414" text-anchor="start">Slides viewed</text><rect x="56.0" y="602.0" width="46.8" height="38.0" rx="9" fill="url(#g)"/><text x="116.8" y="632" font-size="30" font-weight="600" fill="#141414" text-anchor="start">+12%</text><rect x="56.0" y="652.0" width="46.8" height="38.0" rx="9" fill="#2B2B2B"/><text x="116.8" y="682" font-size="30" font-weight="600" fill="#141414" text-anchor="start">+12%</text><text x="56" y="772" font-size="30" font-weight="600" fill="#141414" text-anchor="start">Positive reactions</text><rect x="56.0" y="792.0" width="452.4" height="38.0" rx="9" fill="url(#g)"/><text x="522.4" y="822" font-size="30" font-weight="600" fill="#141414" text-anchor="start">+116%</text><rect x="56.0" y="842.0" width="471.9" height="38.0" rx="9" fill="#2B2B2B"/><text x="541.9" y="872" font-size="30" font-weight="600" fill="#141414" text-anchor="start">+121%</text><text x="56" y="962" font-size="30" font-weight="600" fill="#141414" text-anchor="start">Likelihood to invest</text><rect x="56.0" y="982.0" width="300.0" height="38.0" rx="9" fill="#FFFFFF" stroke="#5E5B57" stroke-width="2" stroke-dasharray="8 8"/><text x="206" y="1012" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="middle">no effect found</text><rect x="56.0" y="1032.0" width="300.0" height="38.0" rx="9" fill="#2B2B2B"/><text x="206" y="1062" font-size="28" font-weight="600" fill="#FFFFFF" text-anchor="middle">increased</text><text x="56" y="1132" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Source: Blaseg and Mayer, Content vs. Design in</text><text x="56" y="1171" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Startup Pitch Decks, Academy of Management</text><text x="56" y="1210" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Annual Meeting 2025.</text></svg>