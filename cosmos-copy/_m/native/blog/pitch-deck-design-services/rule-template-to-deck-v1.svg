<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="872" viewBox="0 0 1600 872" role="img" aria-labelledby="t d"><title id="t">Rule 8: a template is a draft</title><desc id="d">The same slide at three stages: an empty template, a draft with the founder’s own words, and the finished designed slide with one clear number, marked as recently updated.</desc><defs><style>@font-face{font-family:'InterSub';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'InterSub';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:InterSub,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6FB5"/><stop offset="0.5" stop-color="#FFB86B"/><stop offset="1" stop-color="#8FD8FF"/></linearGradient><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2B"/><stop offset="1" stop-color="#2B2B2B" stop-opacity="0"/></linearGradient></defs><rect width="1600" height="872" rx="28" fill="#F4F2EE"/><rect x="24" y="24" width="1552" height="824" rx="22" fill="#FFFFFF"/><text x="72" y="108" font-size="46" font-weight="600" fill="#141414" text-anchor="start">Rule 8: a template is a draft</text><text x="72" y="158" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Same slide, three stages.</text><rect x="72.0" y="258.0" width="440.0" height="500.0" rx="14" fill="#FBFAF8" stroke="#E4E0DA" stroke-width="2"/><rect x="72.0" y="198.0" width="167.0" height="44.0" rx="22.0" fill="#D9D4CD"/><text x="155.508056640625" y="229.72" font-size="27" font-weight="600" fill="#141414" text-anchor="middle">Template</text><text x="100" y="328" font-size="30" font-weight="600" fill="#5E5B57" text-anchor="start">Title goes here</text><rect x="100.0" y="362.0" width="345.6" height="14.0" rx="7" fill="#D9D5CF"/><rect x="100.0" y="392.0" width="345.6" height="14.0" rx="7" fill="#D9D5CF"/><rect x="100.0" y="422.0" width="230.4" height="14.0" rx="7" fill="#D9D5CF"/><rect x="100.0" y="472.0" width="384.0" height="258.0" rx="10" fill="#FFFFFF" stroke="#B9B4AD" stroke-width="2" stroke-dasharray="8 8"/><text x="72" y="806" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">structure, no argument</text><path d="M534 490.0 l22 18 l-22 18" fill="none" stroke="#5E5B57" stroke-width="4" stroke-linecap="round"/><rect x="580.0" y="258.0" width="440.0" height="500.0" rx="14" fill="#FBFAF8" stroke="#E4E0DA" stroke-width="2"/><rect x="580.0" y="198.0" width="176.9" height="44.0" rx="22.0" fill="#D9D4CD"/><text x="668.425537109375" y="229.72" font-size="27" font-weight="600" fill="#141414" text-anchor="middle">Your draft</text><text x="608" y="324" font-size="30" font-weight="600" fill="#141414" text-anchor="start">Grocers throw away fresh</text><text x="608" y="362" font-size="30" font-weight="600" fill="#141414" text-anchor="start">food they paid for.</text><rect x="608.0" y="472.0" width="384.0" height="258.0" rx="10" fill="#D9D5CF"/><text x="580" y="806" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">your words and numbers</text><path d="M1042 490.0 l22 18 l-22 18" fill="none" stroke="#5E5B57" stroke-width="4" stroke-linecap="round"/><rect x="1088.0" y="258.0" width="440.0" height="500.0" rx="14" fill="#FFFFFF" stroke="#E4E0DA" stroke-width="2"/><rect x="1088.0" y="198.0" width="225.4" height="44.0" rx="22.0" fill="url(#g)"/><text x="1200.709716796875" y="229.72" font-size="27" font-weight="600" fill="#141414" text-anchor="middle">Finished deck</text><text x="1116" y="324" font-size="34" font-weight="600" fill="#141414" text-anchor="start">Grocers throw away</text><text x="1116" y="366" font-size="34" font-weight="600" fill="#141414" text-anchor="start">fresh food they paid</text><text x="1116" y="408" font-size="34" font-weight="600" fill="#141414" text-anchor="start">for.</text><text x="1116" y="536" font-size="120" font-weight="