<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1820" viewBox="0 0 800 1820" role="img" aria-labelledby="t d"><title id="t">Problem slide: from a paragraph to one claim</title><desc id="d">Mobile version. Before: a slide titled Problem Statement and Market Context with thirteen lines of small text about grocery retail, AI, architecture and market size. After: a headline, Grocers throw away fresh food they paid for, one large number, 8 percent of fresh stock binned at a pilot store, and one supporting line. Fictional company Kelvadore Foods.</desc><defs><style>@font-face{font-family:'InterSub';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'InterSub';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:InterSub,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6FB5"/><stop offset="0.5" stop-color="#FFB86B"/><stop offset="1" stop-color="#8FD8FF"/></linearGradient><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2B"/><stop offset="1" stop-color="#2B2B2B" stop-opacity="0"/></linearGradient></defs><rect width="800" height="1820" rx="28" fill="#F4F2EE"/><rect x="24" y="24" width="752" height="1772" rx="22" fill="#FFFFFF"/><text x="56" y="100" font-size="44" font-weight="600" fill="#141414" text-anchor="start">Problem slide: from a paragraph</text><text x="56" y="152" font-size="44" font-weight="600" fill="#141414" text-anchor="start">to one claim</text><text x="56" y="202" font-size="30" font-weight="400" fill="#5E5B57" text-anchor="start">Kelvadore Foods is a made-up startup.</text><rect x="50.0" y="312.0" width="700.0" height="600.0" rx="14" fill="#FBFAF8" stroke="#E4E0DA" stroke-width="2"/><rect x="50.0" y="252.0" width="152.6" height="44.0" rx="22.0" fill="#D9D4CD"/><text x="126.3046875" y="284.08" font-size="28" font-weight="600" fill="#141414" text-anchor="middle" letter-spacing="2">BEFORE</text><text x="222.609375" y="283" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">13 lines, no headline claim</text><text x="86" y="416" font-size="28" font-weight="600" fill="#141414" text-anchor="start">Problem Statement &amp; Market Context</text><text x="86" y="464" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">Grocery retail is a complex, multi-layered industry where</text><text x="86" y="495" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">perishable inventory management presents significant</text><text x="86" y="526" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">operational challenges for regional and national chains.</text><text x="86" y="557" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">Demand forecasting remains largely manual and relies on</text><text x="86" y="588" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">legacy ERP data, spreadsheets and store manager intuition,</text><text x="86" y="619" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">which leads to over-ordering, markdowns and disposal costs.</text><text x="86" y="650" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">Our AI platform leverages proprietary ML models, computer</text><text x="86" y="681" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">vision and real-time POS integrations to optimise ordering</text><text x="86" y="712" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">across fresh categories (produce, bakery, dairy, deli) with</text><text x="86" y="743" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">a modular architecture. Pilot data: ~8% of fresh stock binned.</text><text x="86" y="774" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">Key stakeholders: category managers, store ops, finance,</text><text x="86" y="805" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">sustainability teams, suppliers and logistics partners.</text><text x="86" y="836" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">Market: $X bn TAM / $Y bn SAM / $Z bn SOM (est.)</text><rect x="50.0" y="1032.0" width="700.0" height="600.0" rx="14" fill="#FFFFFF" stroke="#E4E0DA" stroke-width="2"/><rect x="50.0" y="972.0" width="134.5" height="44.0" rx="22.0" fill="url(#g)"/><text x="117.267578125" y="1004.08" font-size="28" font-weight="600" fill="#141414" text-anchor="middle" letter-spacing="2">AFTER</text><text x="204.53515625" y="1003" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">one claim, one number</text><text x="94" y="1118" font-size="40" font-weight="600" fill="#141414" text-anchor="start">Grocers throw away</text><text x="94" y="1170" font-size="40" font-weight="600" fill="#141414" text-anchor="start">fresh food they paid for.</text><text x="94" y="1362" font-size="150" font-weight="600" fill="url(#g)">8%</text><text x="94" y="1422" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">of fresh stock is binned at a typical</text><text x="94" y="1460" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Kelvadore pilot store before the change.</text><text x="94" y="1552" font-size="28" font-weight="600" fill="#141414" text-anchor="start">Store managers still</text><text x="94" y="1588" font-size="28" font-weight="600" fill="#141414" text-anchor="start">order by gut feeling.</text><text x="56" y="1694" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Fix: write the conclusion as the headline, keep one</text><text x="56" y="1733" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">number, move the rest to your voice-over or the</text><text x="56" y="1772" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">appendix.</text></svg>