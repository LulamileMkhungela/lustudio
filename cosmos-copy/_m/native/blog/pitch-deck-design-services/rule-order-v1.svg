 x="370.0" y="478.0" width="264.0" height="156.0" rx="16" fill="#F4F2EE"/><text x="392" y="520" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">7</text><text x="392" y="564" font-size="30" font-weight="600" fill="#141414" text-anchor="start">Business</text><text x="392" y="602" font-size="30" font-weight="600" fill="#141414" text-anchor="start">model</text><rect x="668.0" y="478.0" width="264.0" height="156.0" rx="16" fill="#F4F2EE"/><text x="690" y="520" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">8</text><text x="690" y="564" font-size="30" font-weight="600" fill="#141414" text-anchor="start">Team</text><rect x="966.0" y="478.0" width="264.0" height="156.0" rx="16" fill="#F4F2EE"/><text x="988" y="520" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">9</text><text x="988" y="564" font-size="30" font-weight="600" fill="#141414" text-anchor="start">Financials</text><rect x="1264.0" y="478.0" width="264.0" height="156.0" rx="16" fill="#F4F2EE"/><text x="1286" y="520" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">10</text><text x="1286" y="564" font-size="30" font-weight="600" fill="#141414" text-anchor="start">Vision</text><text x="72" y="704" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">Source: Sequoia Capital, Writing a Business Plan. Traction is not a separate section there; the move is our</text><text x="72" y="741" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">practice (rule 1).</text></svg>