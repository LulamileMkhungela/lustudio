<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1820" viewBox="0 0 800 1820" role="img" aria-labelledby="t d"><title id="t">How-it-works slide: from architecture to three steps</title><desc id="d">Mobile version. Before: an architecture diagram with twelve boxes such as POS API, ML core and data lake joined by lines. After: three stacked steps, till and stock data, Kelvadore forecast, tomorrow’s order that the manager approves, under the headline Sales data in, a better order out. Fictional company Kelvadore Foods.</desc><defs><style>@font-face{font-family:'InterSub';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'InterSub';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:InterSub,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6FB5"/><stop offset="0.5" stop-color="#FFB86B"/><stop offset="1" stop-color="#8FD8FF"/></linearGradient><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2B"/><stop offset="1" stop-color="#2B2B2B" stop-opacity="0"/></linearGradient></defs><rect width="800" height="1820" rx="28" fill="#F4F2EE"/><rect x="24" y="24" width="752" height="1772" rx="22" fill="#FFFFFF"/><text x="56" y="100" font-size="44" font-weight="600" fill="#141414" text-anchor="start">How-it-works slide: from</text><text x="56" y="152" font-size="44" font-weight="600" fill="#141414" text-anchor="start">architecture to three steps</text><text x="56" y="202" font-size="30" font-weight="400" fill="#5E5B57" text-anchor="start">Kelvadore Foods is a made-up startup.</text><rect x="50.0" y="312.0" width="700.0" height="600.0" rx="14" fill="#FBFAF8" stroke="#E4E0DA" stroke-width="2"/><rect x="50.0" y="252.0" width="152.6" height="44.0" rx="22.0" fill="#D9D4CD"/><text x="126.3046875" y="284.08" font-size="28" font-weight="600" fill="#141414" text-anch