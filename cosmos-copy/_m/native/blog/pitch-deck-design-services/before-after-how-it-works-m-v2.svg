FF" stroke="#B9B4AD" stroke-width="2"/><text x="399" y="580" font-size="24" font-weight="400" fill="#5E5B57" text-anchor="middle">ML core v3</text><rect x="518.0" y="534.0" width="190.0" height="72.0" rx="8" fill="#FFFFFF" stroke="#B9B4AD" stroke-width="2"/><text x="613" y="580" font-size="24" font-weight="400" fill="#5E5B57" text-anchor="middle">Rules engine</text><rect x="90.0" y="646.0" width="190.0" height="72.0" rx="8" fill="#FFFFFF" stroke="#B9B4AD" stroke-width="2"/><text x="185" y="692" font-size="24" font-weight="400" fill="#5E5B57" text-anchor="middle">Supplier EDI</text><rect x="304.0" y="646.0" width="190.0" height="72.0" rx="8" fill="#FFFFFF" stroke="#B9B4AD" stroke-width="2"/><text x="399" y="692" font-size="24" font-weight="400" fill="#5E5B57" text-anchor="middle">Dashboard</text><rect x="518.0" y="646.0" width="190.0" height="72.0" rx="8" fill="#FFFFFF" stroke="#B9B4AD" stroke-width="2"/><text x="613" y="692" font-size="24" font-weight="400" fill="#5E5B57" text-anchor="middle">Alerts</text><rect x="90.0" y="758.0" width="190.0" height="72.0" rx="8" fill="#FFFFFF" stroke="#B9B4AD" stroke-width="2"/><text x="185" y="804" font-size="24" font-weight="400" fill="#5E5B57" text-anchor="middle">Data lake</text><rect x="304.0" y="758.0" width="190.0" height="72.0" rx="8" fill="#FFFFFF" stroke="#B9B4AD" stroke-width="2"/><text x="399" y="804" font-size="24" font-weight="400" fill="#5E5B57" text-anchor="middle">Auth / SSO</text><rect x="518.0" y="758.0" width="190.0" height="72.0" rx="8" fill="#FFFFFF" stroke="#B9B4AD" stroke-width="2"/><text x="613" y="804" font-size="24" font-weight="400" fill="#5E5B57" text-anchor="middle">Reporting</text><rect x="50.0" y="1032.0" width="700.0" height="600.0" rx="14" fill="#FFFFFF" stroke="#E4E0DA" stroke-width="2"/><rect x="50.0" y="972.0" width="134.5" height="44.0" rx="22.0" fill="url(#g)"/><text x="117.267578125" y="1004.08" font-size="28" font-weight="600" fill="#141414" text-anchor="middle" letter-spacing="2">AFTER</text><text x="204.53515625" y="1003" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">input, product, decision</text><text x="94" y="1118" font-size="34" font-weight="600" fill="#141414" text-anchor="start">Sales data in, a better order out.</text><rect x="94.0" y="1172.0" width="612.0" height="104.0" rx="16" fill="#F4F2EE"/><text x="126" y="1220" font-size="30" font-weight="600" fill="#141414" text-anchor="start">Till and stock data</text><text x="126" y="1258" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">what sold, what is left</text><path d="M386.0 1284 l14 18 l14 -18" fill="#2B2B2B"/><rect x="94.0" y="1312.0" width="612.0" height="104.0" rx="16" fill="url(#g)"/><text x="126" y="1360" font-size="30" font-weight="600" fill="#141414" text-anchor="start">Kelvadore forecast</text><text x="126" y="1398" font-size="28" font-weight="400" fill="#141414" text-anchor="start">demand per item, per store</text><path d="M386.0 1424 l14 18 l14 -18" fill="#2B2B2B"/><rect x="94.0" y="1452.0" width="612.0" height="104.0" rx="16" fill="#F4F2EE"/><text x="126" y="1500" font-size="30" font-weight="600" fill="#141414" text-anchor="start">Tomorrow’s order</text><text x="126" y="1538" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">the manager approves it</text><text x="56" y="1694" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Fix: show what goes in, what your product does</text><text x="56" y="1733" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">and what the user decides. Keep the architecture</text><text x="56" y="1772" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">for technical due diligence.</text></svg>