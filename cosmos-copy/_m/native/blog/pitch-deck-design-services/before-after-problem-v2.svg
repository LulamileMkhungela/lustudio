<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="976" viewBox="0 0 1600 976" role="img" aria-labelledby="t d"><title id="t">Problem slide: from a paragraph to one claim</title><desc id="d">Before: a slide titled Problem Statement and Market Context with thirteen lines of small text about grocery retail, AI, architecture and market size. After: a headline, Grocers throw away fresh food they paid for, one large number, 8 percent of fresh stock binned at a pilot store, and one supporting line. Fictional company Kelvadore Foods.</desc><defs><style>@font-face{font-family:'InterSub';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'InterSub';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:InterSub,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6FB5"/><stop offset="0.5" stop-color="#FFB86B"/><stop offset="1" stop-color="#8FD8FF"/></linearGradient><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2B"/><stop offset="1" stop-color="#2B2B2B" stop-opacity="0"/></linearGradient></defs><rect width="1600" height="976" rx="28" fill="#F4F2EE"/><rect x="24" y="24" width="1552" height="928" rx="22" fill="#FFFFFF"/><text x="72" y="108" font-size="46" font-weight="600" fill="#141414" text-anchor="start">Problem slide: from a paragraph to one claim</text><text x="72" y="158" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Kelvadore Foods is a made-up startup. Both slides use the same data.</text><rect x="72.0" y="258.0" width="700.0" height="600.0" rx="14" fill="#FBFAF8" stroke="#E4E0DA" stroke-width="2"/><rect x="72.0" y="198.0" width="148.7" height="44.0" rx="22.0" fill="#D9D4CD"/><text x="146.365234375" y="229.72" font-size="27" font-weight="600" fill="#141414" text-anchor="middle" letter-spacing="2">BEFORE</text><text x="240.73046875" y="229" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">13 lines, no headline claim</text><text x="108" y="362" font-size="27" font-weight="600" fill="#141414" text-anchor="start">Problem Statement &amp; Market Context</text><text x="108" y="410" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">Grocery retail is a complex, multi-layered industry where</text><text x="108" y="441" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">perishable inventory management presents significant</text><text x="108" y="472" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">operational challenges for regional and national chains.</text><text x="108" y="503" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">Demand forecasting remains largely manual and relies on</text><text x="108" y="534" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">legacy ERP data, spreadsheets and store manager intuition,</text><text x="108" y="565" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">which leads to over-ordering, markdowns and disposal costs.</text><text x="108" y="596" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">Our AI platform leverages proprietary ML models, computer</text><text x="108" y="627" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">vision and real-time POS integrations to optimise ordering</text><text x="108" y="658" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">across fresh categories (produce, bakery, dairy, deli) with</text><text x="108" y="689" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">a modular architecture. Pilot data: ~8% of fresh stock binned.</text><text x="108" y="720" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">Key stakeholders: category managers, store ops, finance,</text><text x="108" y="751" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">sustainability teams, suppliers and logistics partners.</text><text x="108" y="782" font-size="21" font-weight="400" fill="#5E5B57" text-anchor="start">Market: $X bn TAM / $Y bn SAM / $Z bn SOM (est.)</text><rect x="828.0" y="258.0" width="700.0" height="600.0" rx="14" fill="#FFFFFF" stroke="#E4E0DA" stroke-width="2"/><rect x="828.0" y="198.0" width="131.3" height="44.0" rx="22.0" fill="url(#g)"/><text x="893.65087890625" y="229.72" font-size="27" font-weight="600" fill="#141414" text-anchor="middle" letter-spacing="2">AFTER</text><text x="979.3017578125" y="229" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">one claim, one number</text><text x="872" y="344" font-size="40" font-weight="600" fill="#141414" text-anchor="start">Grocers throw away</text><text x="872" y="396" font-size="40" font-weight="600" fill="#141414" text-anchor="start">fresh food they paid for.</text><text x="872" y="588" font-size="150" font-weight="600" fill="url(#g)">8%</text><text x="872" y="648" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">of fresh stock is binned at a typical</text><text x="872" y="686" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Kelvadore pilot store before the change.</text><text x="872" y="778" font-size="27" font-weight="600" fill="#141414" text-anchor="start">Store managers still</text><text x="872" y="814" font-size="27" font-weight="600" fill="#141414" text-anchor="start">order by gut feeling.</text><path d="M786 540.0 l22 18 l-22 18" fill="none" stroke="#5E5B57" stroke-width="4" stroke-linecap="round"/><text x="72" y="920" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">Fix: write the conclusion as the headline, keep one number, move the rest to your voice-over or the appendix.</text></svg>