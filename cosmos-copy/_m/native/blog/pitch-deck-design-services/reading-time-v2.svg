025–2026 data. Grey: older DocSend data.</text><text x="72" y="1086" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">Papermark also reports 18 minutes of median total attention per deck across a raise.</text><text x="72" y="1124" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">Sources: Papermark Fundraising Report 2026; Storydoc 2026; DocSend Startup Index</text><text x="72" y="1162" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">2023–2024; TechCrunch on DocSend, 2015.</text></svg>