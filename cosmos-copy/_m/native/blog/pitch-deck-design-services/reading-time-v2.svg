<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1228" viewBox="0 0 1600 1228" role="img" aria-labelledby="t d"><title id="t">How long investors spend on a pitch deck, by source and year</title><desc id="d">Bar chart in minutes. Papermark 2026: half of single views end within 77 seconds; average view 4.0 minutes. Storydoc 2025–26: 4:51 on desktop, 3:27 on mobile. DocSend weekly tracker 2023–24: 2:18 to 2:42. DocSend seed decks 2023: 1:56. DocSend 2015 study: 3:44, still quoted in 2026.</desc><defs><style>@font-face{font-family:'InterSub';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'InterSub';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:InterSub,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6FB5"/><stop offset="0.5" stop-color="#FFB86B"/><stop offset="1" stop-color="#8FD8FF"/></linearGradient><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2B"/><stop offset="1" stop-color="#2B2B2B" stop-opacity="0"/></linearGradient></defs><rect width="1600" height="1228" rx="28" fill="#F4F2EE"/><rect x="24" y="24" width="1552" height="1180" rx="22" fill="#FFFFFF"/><text x="72" y="108" font-size="46" font-weight="600" fill="#141414" text-anchor="start">How long investors spend on a pitch deck</text><text x="72" y="158" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Minutes. Each figure measures something different – check the label and the year.</text><line x1="720.0" y1="196" x2="720.0" y2="934" stroke="#E4E0DA" stroke-width="2"/><text x="720.0" y="972" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="middle">0 min</text><line x1="856.0" y1="196" x2="856.0" y2="934" stroke="#E4E0DA" stroke-width="2"/><text x="856.0" y="972" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="middle">1 min</text>