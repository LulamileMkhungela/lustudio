<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="708" viewBox="0 0 1600 708" role="img" aria-labelledby="t d"><title id="t">How a deck gets made at LulaZel Hub</title><desc id="d">Four steps of a LulaZel Hub pitch deck project: the call with an NDA first if needed, your content, design of up to 20 slides in about one week, then two rounds of small revisions and delivery as a link, HTML files or PDF.</desc><defs><style>@font-face{font-family:'InterSub';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'InterSub';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:InterSub,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6FB5"/><stop offset="0.5" stop-color="#FFB86B"/><stop offset="1" stop-color="#8FD8FF"/></linearGradient><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2B"/><stop offset="1" stop-color="#2B2B2B" stop-opacity="0"/></linearGradient></defs><rect width="1600" height="708" rx="28" fill="#F4F2EE"/><rect x="24" y="24" width="1552" height="660" rx="22" fill="#FFFFFF"/><text x="72" y="108" font-size="46" font-weight="600" fill="#141414" text-anchor="start">How a deck gets made at LulaZel Hub</text><text x="72" y="158" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Base timeline: about one week when your content is ready.</text><line x1="100" y1="248" x2="1500" y2="248" stroke="#B9B4AD" stroke-width="3"/><rect x="72.0" y="304.0" width="346.0" height="340.0" rx="18" fill="#F4F2EE"/><circle cx="100" cy="248" r="28" fill="#2B2B2B"/><text x="100" y="258" font-size="29" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text><text x="96" y="360" font-size="32" font-weight="600" fill="#141414" text-anchor="start">The call</text><text x="96" y="454" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">You pitch it to us. NDA</text><text x="96" y="490" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">first, if you need one.</text><rect x="96.0" y="576.0" width="104.4" height="44.0" rx="22.0" fill="#FFFFFF"/><text x="148.1982421875" y="607.72" font-size="27" font-weight="400" fill="#141414" text-anchor="middle">Day 1</text><rect x="442.0" y="304.0" width="346.0" height="340.0" rx="18" fill="#F4F2EE"/><circle cx="470" cy="248" r="28" fill="#2B2B2B"/><text x="470" y="258" font-size="29" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text><text x="466" y="360" font-size="32" font-weight="600" fill="#141414" text-anchor="start">Your content</text><text x="466" y="454" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">Text, numbers, visuals</text><text x="466" y="490" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">for each slide.</text><rect x="466.0" y="576.0" width="150.9" height="44.0" rx="22.0" fill="#FFFFFF"/><text x="541.460693359375" y="607.72" font-size="27" font-weight="400" fill="#141414" text-anchor="middle">from you</text><rect x="812.0" y="304.0" width="346.0" height="340.0" rx="18" fill="#F4F2EE"/><circle cx="840" cy="248" r="28" fill="url(#g)"/><text x="840" y="258" font-size="29" font-weight="600" fill="#141414" text-anchor="middle">3</text><text x="836" y="360" font-size="32" font-weight="600" fill="#141414" text-anchor="start">Design</text><text x="836" y="454" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">Up to 20 slides in your</text><text x="836" y="490" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">brand, animated HTML</text><text x="836" y="526" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">or Figma.</text><rect x="836.0" y="576.0" width="205.8" height="44.0" rx="22.0" fill="url(#g)"/><text x="938.922119140625" y="607.72" font-size="27" font-weight="600" fill="#141414" text-anchor="middle">about 1 week</text><rect x="1182.0" y="304.0" width="346.0" height="340.0" rx="18" fill="#F4F2EE"/><circle cx="1210" cy="248" r="28" fill="#2B2B2B"/><text x="1210" y="258" font-size="29" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text><text x="1206" y="360" font-size="32" font-weight="600" fill="#141414" text-anchor="start">Revisions and</text><text x="1206" y="400" font-size="32" font-weight="600" fill="#141414" text-anchor="start">delivery</text><text x="1206" y="454" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">2 rounds of small edits.</text><text x="1206" y="490" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">Link, HTML files or</text><text x="1206" y="526" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">PDF.</text><rect x="1206.0" y="576.0" width="252.9" height="44.0" rx="22.0" fill="#FFFFFF"/><text x="1332.4482421875" y="607.72" font-size="27" font-weight="400" fill="#141414" text-anchor="middle">all files are yours</text></svg>