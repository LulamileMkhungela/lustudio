<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1410" viewBox="0 0 800 1410" role="img" aria-labelledby="t d"><title id="t">Rule 6: show the plan, not only the product</title><desc id="d">Mobile version. A made-up ask slide for the fictional startup Kelvadore Foods: a R27,000,000 seed round, split 50% product, 30% sales, 20% operations, with milestones at months 6, 12 and 18.</desc><defs><style>@font-face{font-family:'InterSub';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'InterSub';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:InterSub,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6FB5"/><stop offset="0.5" stop-color="#FFB86B"/><stop offset="1" stop-color="#8FD8FF"/></linearGradient><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2B"/><stop offset="1" stop-color="#2B2B2B" stop-opacity="0"/></linearGradient></defs><rect width="800" height="1410" rx="28" fill="#F4F2EE"/><rect x="24" y="24" width="752" height="1362" rx="22" fill="#FFFFFF"/><text x="56" y="100" font-size="44" font-weight="600" fill="#141414" text-anchor="start">Rule 6: show the plan, not only</text><text x="56" y="152" font-size="44" font-weight="600" fill="#141414" text-anchor="start">the product</text><text x="56" y="202" font-size="30" font-weight="400" fill="#5E5B57" text-anchor="start">A made-up ask slide for Kelvadore Foods, the</text><text x="56" y="242" font-size="30" font-weight="400" fill="#5E5B57" text-anchor="start">fictional startup used below.</text><rect x="50.0" y="302.0" width="700.0" height="884.0" rx="16" fill="#FFFFFF" stroke="#E4E0DA" stroke-width="2"/><text x="90" y="382" font-size="38" font-weight="600" fill="#141414" text-anchor="start">R27,000,000 seed takes us to 60 stores</text><text x="90" y="432" font-size="38" font-weight="600" fill="#141414" text-anchor="start">in 18 months</text><text x="90" y="516" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Where the money goes</text><rect x="90.0" y="544.0" width="310.0" height="64.0" rx="8" fill="#2B2B2B"/><text x="245.0" y="587" font-size="30" font-weight="600" fill="#FFFFFF" text-anchor="middle">50%</text><rect x="400.0" y="544.0" width="186.0" height="64.0" rx="8" fill="#8C8882"/><text x="493.0" y="587" font-size="30" font-weight="600" fill="#FFFFFF" text-anchor="middle">30%</text><rect x="586.0" y="544.0" width="124.0" height="64.0" rx="8" fill="#B9B4AD"/><text x="648.0" y="587" font-size="30" font-weight="600" fill="#141414" text-anchor="middle">20%</text><rect x="90.0" y="642.0" width="28.0" height="28.0" rx="7" fill="#2B2B2B"/><text x="134" y="664" font-size="29" font-weight="600" fill="#141414" text-anchor="start">Product</text><text x="258.85986328125" y="664" font-size="29" font-weight="400" fill="#5E5B57" text-anchor="start">50%</text><rect x="90.0" y="688.0" width="28.0" height="28.0" rx="7" fill="#8C8882"/><text x="134" y="710" font-size="29" font-weight="600" fill="#141414" text-anchor="start">Sales</text><text x="224.181640625" y="710" font-size="29" font-weight="400" fill="#5E5B57" text-anchor="start">30%</text><rect x="90.0" y="734.0" width="28.0" height="28.0" rx="7" fill="#B9B4AD"/><text x="134" y="756" font-size="29" font-weight="600" fill="#141414" text-anchor="start">Operations</text><text x="302.85546875" y="756" font-size="29" font-weight="400" fill="#5E5B57" text-anchor="start">20%</text><text x="90" y="836" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Milestones</text><line x1="102" y1="884" x2="102" y2="1116" stroke="#B9B4AD" stroke-width="3"/><circle cx="102" cy="884" r="12" fill="#2B2B2B"/><text x="134" y="888" font-size="29" font-weight="600" fill="#141414" text-anchor="start">Month 6</text><text x="134" y="926" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">24 → 40 stores</text><circle cx="102" cy="1000" r="12" fill="#2B2B2B"/><text x="134" y="1004" font-size="29" font-weight="600" fill="#141414" text-anchor="start">Month 12</text><text x="134" y="1042" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">R18,000,000 ARR</text><circle cx="102" cy="1116" r="12" fill="url(#g)"/><text x="134" y="1120" font-size="29" font-weight="600" fill="#141414" text-anchor="start">Month 18</text><text x="134" y="1158" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">60 stores, Series A ready</text><rect x="56.0" y="1224.0" width="8.0" height="28.0" rx="4" fill="url(#g)"/><text x="80" y="1248" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">what the round pays for</text><rect x="56.0" y="1268.0" width="8.0" height="28.0" rx="4" fill="url(#g)"/><text x="80" y="1292" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">which milestones it reaches</text><rect x="56.0" y="1312.0" width="8.0" height="28.0" rx="4" fill="url(#g)"/><text x="80" y="1336" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">how it becomes a return</text></svg>