<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1708" viewBox="0 0 800 1708" role="img" aria-labelledby="t d"><title id="t">Rule 7: one to send, one to present, both checked on a phone</title><desc id="d">Mobile version. Three panels: a send-ahead deck of 12–16 slides plus an appendix that works without the founder, a live deck of 8–10 slides with large type, and a phone check: Storydoc found 32% of decks are opened on a phone, with 3:27 average reading time against 4:51 on desktop.</desc><defs><style>@font-face{font-family:'InterSub';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'InterSub';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:InterSub,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6FB5"/><stop offset="0.5" stop-color="#FFB86B"/><stop offset="1" stop-color="#8FD8FF"/></linearGradient><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2B"/><stop offset="1" stop-color="#2B2B2B" stop-opacity="0"/></linearGradient></defs><rect width="800" height="1708" rx="28" fill="#F4F2EE"/><rect x="24" y="24" width="752" height="1660" rx="22" fill="#FFFFFF"/><text x="56" y="100" font-size="44" font-weight="600" fill="#141414" text-anchor="start">Rule 7: one to send, one to</text><text x="56" y="152" font-size="44" font-weight="600" fill="#141414" text-anchor="start">present, both checked on a</text><text x="56" y="204" font-size="44" font-weight="600" fill="#141414" text-anchor="start">phone</text><text x="56" y="254" font-size="30" font-weight="400" fill="#5E5B57" text-anchor="start">Phone data: Storydoc, 1.3 million sessions,</text><text x="56" y="294" font-size="30" font-weight="400" fill="#5E5B57" text-anchor="start">updated October 2026.</text><rect x="56.0" y="350.0" width="688.0" height="430.0" rx="20" fill="#F4F2EE"/><text x="84" y="410" font-size="34" font-weight="600" fill="#141414" text-anchor="start">Send ahead</text><rect x="84.0" y="440.0" width="632.0" height="200.0" rx="10" fill="#FFFFFF" stroke="#E4E0DA" stroke-width="2"/><rect x="108.0" y="464.0" width="347.6" height="18.0" rx="6" fill="#2B2B2B"/><rect x="108.0" y="502.0" width="505.6" height="10.0" rx="5" fill="#D9D5CF"/><rect x="108.0" y="524.0" width="505.6" height="10.0" rx="5" fill="#D9D5CF"/><rect x="108.0" y="546.0" width="505.6" height="10.0" rx="5" fill="#D9D5CF"/><rect x="108.0" y="568.0" width="316.0" height="10.0" rx="5" fill="#D9D5CF"/><rect x="566.0" y="596.0" width="32.0" height="22.0" rx="5" fill="#2B2B2B"/><rect x="610.0" y="580.0" width="32.0" height="38.0" rx="5" fill="#2B2B2B"/><rect x="654.0" y="556.0" width="32.0" height="62.0" rx="5" fill="url(#g)"/><text x="84" y="690" font-size="30" font-weight="600" fill="#141414" text-anchor="start">12–16 slides + appendix</text><text x="84" y="730" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">works without you</text><rect x="56.0" y="804.0" width="688.0" height="430.0" rx="20" fill="#F4F2EE"/><text x="84" y="864" font-size="34" font-weight="600" fill="#141414" text-anchor="start">Present live</text><rect x="84.0" y="894.0" width="632.0" height="200.0" rx="10" fill="#FFFFFF" stroke="#E4E0DA" stroke-width="2"/><text x="400.0" y="1024.0" font-size="96" font-weight="600" fill="url(#g)" text-anchor="middle">3x</text><rect x="210.4" y="1054.0" width="379.2" height="12.0" rx="6" fill="#D9D5CF"/><text x="84" y="1144" font-size="30" font-weight="600" fill="#141414" text-anchor="start">8–10 slides</text><text x="84" y="1184" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">large type, you say the rest</text><rect x="56.0" y="1258.0" width="688.0" height="400.0" rx="20" fill="#F4F2EE"/><text x="84" y="1318" font-size="34" font-weight="600" fill="#141414" text-anchor="start">On a phone</text><rect x="92.0" y="1348.0" width="150.0" height=