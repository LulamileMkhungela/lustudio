<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1428" viewBox="0 0 800 1428" role="img" aria-labelledby="t d"><title id="t">How a deck gets made at Cosmos Studio</title><desc id="d">Mobile version. Four steps of a Cosmos Studio pitch deck project: the call with an NDA first if needed, your content, design of up to 20 slides in about one week, then two rounds of small revisions and delivery as a link, HTML files or PDF.</desc><defs><style>@font-face{font-family:'InterSub';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'InterSub';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:InterSub,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6FB5"/><stop offset="0.5" stop-color="#FFB86B"/><stop offset="1" stop-color="#8FD8FF"/></linearGradient><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2B"/><stop offset="1" stop-color="#2B2B2B" stop-opacity="0"/></linearGradient></defs><rect width="800" height="1428" rx="28" fill="#F4F2EE"/><rect x="24" y="24" width="752" height="1380" rx="22" fill="#FFFFFF"/><text x="56" y="100" font-size="44" font-weight="600" fill="#141414" text-anchor="start">How a deck gets made at</text><text x="56" y="152" font-size="44" font-weight="600" fill="#141414" text-anchor="start">Cosmos Studio</text><text x="56" y="202" font-size="30" font-weight="400" fill="#5E5B57" text-anchor="start">Base timeline: about one week when your</text><text x="56" y="242" font-size="30" font-weight="400" fill="#5E5B57" text-anchor="start">content is ready.</text><line x1="90" y1="340" x2="90" y2="1162" stroke="#B9B4AD" stroke-width="3"/><rect x="130.0" y="312.0" width="614.0" height="250.0" rx="18" fill="#F4F2EE"/><circle cx="90" cy="340" r="28" fill="#2B2B2B"/><text x="90" y="350" font-size="29" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text><text x="154" y="368" font-size="32" font-weight="600" fill="#141414" text-anchor="start">The call</text><text x="154" y="416" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">You pitch it to us. NDA first, if you need</text><text x="154" y="452" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">one.</text><rect x="154.0" y="494.0" width="106.9" height="44.0" rx="22.0" fill="#FFFFFF"/><text x="207.46484375" y="526.08" font-size="28" font-weight="400" fill="#141414" text-anchor="middle">Day 1</text><rect x="130.0" y="586.0" width="614.0" height="250.0" rx="18" fill="#F4F2EE"/><circle cx="90" cy="614" r="28" fill="#2B2B2B"/><text x="90" y="624" font-size="29" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text><text x="154" y="642" font-size="32" font-weight="600" fill="#141414" text-anchor="start">Your content</text><text x="154" y="690" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Text, numbers, visuals for each slide.</text><rect x="154.0" y="768.0" width="155.2" height="44.0" rx="22.0" fill="#FFFFFF"/><text x="231.5888671875" y="800.08" font-size="28" font-weight="400" fill="#141414" text-anchor="middle">from you</text><rect x="130.0" y="860.0" width="614.0" height="250.0" rx="18" fill="#F4F2EE"/><circle cx="90" cy="888" r="28" fill="url(#g)"/><text x="90" y="898" font-size="29" font-weight="600" fill="#141414" text-anchor="middle">3</text><text x="154" y="916" font-size="32" font-weight="600" fill="#141414" text-anchor="start">Design</text><text x="154" y="964" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Up to 20 slides in your brand, animated</text><text x="154" y="1000" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">HTML or Figma.</text><rect x="154.0" y="1042.0" width="212.1" height="44.0" rx="22.0" fill="url(#g)"/><text x="260.0673828125" y="1074.08" font-size="28" font-weight="600" fill="#141414" text-anchor="middle">about 1 week</text><rect x="130.0" y="1134.0" width="614.0" height="250.0" rx="18" fill="#F4F2EE"/><circle cx="90" cy="1162" r="28" fill="#2B2B2B"/><text x="90" y="1172" font-size="29" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text><text x="154" y="1190" font-size="32" font-weight="600" fill="#141414" text-anchor="start">Revisions and delivery</text><text x="154" y="1238" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">2 rounds of small edits. Link, HTML files or</text><text x="154" y="1274" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">PDF.</text><rect x="154.0" y="1316.0" width="260.9" height="44.0" rx="22.0" fill="#FFFFFF"/><text x="284.46484375" y="1348.08" font-size="28" font-weight="400" fill="#141414" text-anchor="middle">all files are yours</text></svg>