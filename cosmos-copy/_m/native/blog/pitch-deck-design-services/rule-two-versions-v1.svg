<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="788" viewBox="0 0 1600 788" role="img" aria-labelledby="t d"><title id="t">Rule 7: one to send, one to present, both checked on a phone</title><desc id="d">Three panels: a send-ahead deck of 12–16 slides plus an appendix that works without the founder, a live deck of 8–10 slides with large type, and a phone check: Storydoc found 32% of decks are opened on a phone, with 3:27 average reading time against 4:51 on desktop.</desc><defs><style>@font-face{font-family:'InterSub';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'InterSub';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:InterSub,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6FB5"/><stop offset="0.5" stop-color="#FFB86B"/><stop offset="1" stop-color="#8FD8FF"/></linearGradient><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2B"/><stop offset="1" stop-color="#2B2B2B" stop-opacity="0"/></linearGradient></defs><rect width="1600" height="788" rx="28" fill="#F4F2EE"/><rect x="24" y="24" width="1552" height="740" rx="22" fill="#FFFFFF"/><text x="72" y="108" font-size="46" font-weight="600" fill="#141414" text-anchor="start">Rule 7: one to send, one to present, both checked on a phone</text><text x="72" y="158" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Phone data: Storydoc, 1.3 million sessions, updated October 2026.</text><rect x="72.0" y="218.0" width="466.0" height="520.0" rx="20" fill="#F4F2EE"/><rect x="567.0" y="218.0" width="466.0" height="520.0" rx="20" fill="#F4F2EE"/><rect x="1062.0" y="218.0" width="466.0" height="520.0" rx="20" fill="#F4F2EE"/><text x="104" y="286" font-size="34" font-weight="600" fill="#141414" text-anchor="start">Send ahead</text><rect x="104.0" y="318.0" width="402.0" height="230.0" rx="10" fill="#FFFFFF" stroke="#E4E0DA" stroke-width="2"/><rect x="128.0" y="342.0" width="221.1" height="18.0" rx="6" fill="#2B2B2B"/><rect x="128.0" y="380.0" width="321.6" height="10.0" rx="5" fill="#D9D5CF"/><rect x="128.0" y="402.0" width="321.6" height="10.0" rx="5" fill="#D9D5CF"/><rect x="128.0" y="424.0" width="321.6" height="10.0" rx="5" fill="#D9D5CF"/><rect x="128.0" y="446.0" width="201.0" height="10.0" rx="5" fill="#D9D5CF"/><rect x="356.0" y="504.0" width="32.0" height="22.0" rx="5" fill="#2B2B2B"/><rect x="400.0" y="488.0" width="32.0" height="38.0" rx="5" fill="#2B2B2B"/><rect x="444.0" y="464.0" width="32.0" height="62.0" rx="5" fill="url(#g)"/><text x="104" y="608" font-size="29" font-weight="600" fill="#141414" text-anchor="start">12–16 slides + appendix</text><text x="104" y="650" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">works without you</text><text x="599" y="286" font-size="34" font-weight="600" fill="#141414" text-anchor="start">Present live</text><rect x="599.0" y="318.0" width="402.0" height="230.0" rx="10" fill="#FFFFFF" stroke="#E4E0DA" stroke-width="2"/><text x="800.0" y="463.0" font-size="96" font-weight="600" fill="url(#g)" text-anchor="middle">3x</text><rect x="679.4" y="508.0" width="241.2" height="12.0" rx="6" fill="#D9D5CF"/><text x="599" y="608" font-size="29" font-weight="600" fill="#141414" text-anchor="start">8–10 slides</text><text x="599" y="650" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">large type, you say the rest</text><text x="1094" y="286" font-size="34" font-weight="600" fill="#141414" text-anchor="start">On a phone</text><rect x="1102.0" y="318.0" width="150.0" height="262.0" rx="26" fill="#2B2B2B"/><rect x="1112.0" y="348.0" width="130.0" height="202.0" rx="8" fill="#FFFFFF"/><rect x="1122.0" y="364.0" width="110.0" height="12.0" rx="4" fill="#2B2B2B"/><rect x="1122.0" y="390.0" width="99.0" height="7.0" rx="3" fill="#D9D5CF"/><rect x="1122.0" y="406.0" w