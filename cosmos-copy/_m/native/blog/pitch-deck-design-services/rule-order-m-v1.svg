.0" y="822.0" width="332.0" height="140.0" rx="16" fill="#F4F2EE"/><text x="78" y="864" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">7</text><text x="78" y="908" font-size="30" font-weight="600" fill="#141414" text-anchor="start">Business model</text><rect x="412.0" y="822.0" width="332.0" height="140.0" rx="16" fill="#F4F2EE"/><text x="434" y="864" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">8</text><text x="434" y="908" font-size="30" font-weight="600" fill="#141414" text-anchor="start">Team</text><rect x="56.0" y="982.0" width="332.0" height="140.0" rx="16" fill="#F4F2EE"/><text x="78" y="1024" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">9</text><text x="78" y="1068" font-size="30" font-weight="600" fill="#141414" text-anchor="start">Financials</text><rect x="412.0" y="982.0" width="332.0" height="140.0" rx="16" fill="#F4F2EE"/><text x="434" y="1024" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">10</text><text x="434" y="1068" font-size="30" font-weight="600" fill="#141414" text-anchor="start">Vision</text><text x="56" y="1172" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Source: Sequoia Capital, Writing a Business Plan.</text><text x="56" y="1211" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Traction is not a separate section there; the move is</text><text x="56" y="1250" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">our practice (rule 1).</text></svg>