<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1308" viewBox="0 0 800 1308" role="img" aria-labelledby="t d"><title id="t">Rule 3: an order investors already know</title><desc id="d">Mobile version. Sequoia’s ten-section pitch outline as numbered tiles: company purpose, problem, solution, why now, market potential, competition, business model, team, financials, vision, with a note to move strong traction to the front.</desc><defs><style>@font-face{font-family:'InterSub';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'InterSub';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:InterSub,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6FB5"/><stop offset="0.5" stop-color="#FFB86B"/><stop offset="1" stop-color="#8FD8FF"/></linearGradient><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2B"/><stop offset="1" stop-color="#2B2B2B" stop-opacity="0"/></linearGradient></defs><rect width="800" height="1308" rx="28" fill="#F4F2EE"/><rect x="24" y="24" width="752" height="1260" rx="22" fill="#FFFFFF"/><text x="56" y="100" font-size="44" font-weight="600" fill="#141414" text-anchor="start">Rule 3: an order investors</text><text x="56" y="152" font-size="44" font-weight="600" fill="#141414" text-anchor="start">already know</text><text x="56" y="202" font-size="30" font-weight="400" fill="#5E5B57" text-anchor="start">Sequoia’s outline: ten sections.</text><rect x="300.0" y="242.0" width="200.0" height="56.0" rx="28" fill="#FFFFFF" stroke="url(#g)" stroke-width="4"/><text x="400.0" y="280" font-size="30" font-weight="600" fill="#141414" text-anchor="middle">Traction</text><line x1="400.0" y1="304" x2="400.0" y2="330" stroke="#C93A6E" stroke-width="4" stroke-linecap="round"/><path d="M388.0 316 L400.0 334 L412.0 316" fill="none" stroke="#C93A6E" s