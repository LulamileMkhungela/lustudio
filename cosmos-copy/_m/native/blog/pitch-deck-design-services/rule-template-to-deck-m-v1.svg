<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1890" viewBox="0 0 800 1890" role="img" aria-labelledby="t d"><title id="t">Rule 8: a template is a draft</title><desc id="d">Mobile version. The same slide at three stages: an empty template, a draft with the founder’s own words, and the finished designed slide with one clear number, marked as recently updated.</desc><defs><style>@font-face{font-family:'InterSub';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'InterSub';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:InterSub,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6FB5"/><stop offset="0.5" stop-color="#FFB86B"/><stop offset="1" stop-color="#8FD8FF"/></linearGradient><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2B"/><stop offset="1" stop-color="#2B2B2B" stop-opacity="0"/></linearGradient></defs><rect width="800" height="1890" rx="28" fill="#F4F2EE"/><rect x="24" y="24" width="752" height="1842" rx="22" fill="#FFFFFF"/><text x="56" y="100" font-size="44" font-weight="600" fill="#141414" text-anchor="start">Rule 8: a template is a draft</text><text x="56" y="150" font-size="30" font-weight="400" fill="#5E5B57" text-anchor="start">Same slide, three stages.</text><rect x="56.0" y="250.0" width="688.0" height="440.0" rx="14" fill="#FBFAF8" stroke="#E4E0DA" stroke-width="2"/><rect x="56.0" y="190.0" width="171.6" height="44.0" rx="22.0" fill="#D9D4CD"/><text x="141.7861328125" y="222.08" font-size="28" font-weight="600" fill="#141414" text-anchor="middle">Template</text><text x="84" y="320" font-size="30" font-weight="600" fill="#5E5B57" text-anchor="start">Title goes here</text><rect x="84.0" y="354.0" width="568.8" height="14.0" rx="7" fill="#D9D5CF"/><rect x="84.0" y="384.0" width="568.8" height="14.0" rx="7" fill="#D9D5CF"/><rect x="84.0" y="414.0" width="379.2" height="14.0" rx="7" fill="#D9D5CF"/><rect x="84.0" y="464.0" width="632.0" height="198.0" rx="10" fill="#FFFFFF" stroke="#B9B4AD" stroke-width="2" stroke-dasharray="8 8"/><text x="247.572265625" y="221" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">structure, no argument</text><rect x="56.0" y="820.0" width="688.0" height="440.0" rx="14" fill="#FBFAF8" stroke="#E4E0DA" stroke-width="2"/><rect x="56.0" y="760.0" width="181.8" height="44.0" rx="22.0" fill="#D9D4CD"/><text x="146.8857421875" y="792.08" font-size="28" font-weight="600" fill="#141414" text-anchor="middle">Your draft</text><text x="84" y="886" font-size="30" font-weight="600" fill="#141414" text-anchor="start">Grocers throw away fresh food they paid</text><text x="84" y="924" font-size="30" font-weight="600" fill="#141414" text-anchor="start">for.</text><rect x="84.0" y="1034.0" width="632.0" height="198.0" rx="10" fill="#D9D5CF"/><text x="257.771484375" y="791" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">your words and numbers</text><rect x="56.0" y="1390.0" width="688.0" height="440.0" rx="14" fill="#FFFFFF" stroke="#E4E0DA" stroke-width="2"/><rect x="56.0" y="1330.0" width="232.1" height="44.0" rx="22.0" fill="url(#g)"/><text x="172.0693359375" y="1362.08" font-size="28" font-weight="600" fill="#141414" text-anchor="middle">Finished deck</text><text x="84" y="1456" font-size="34" font-weight="600" fill="#141414" text-anchor="start">Grocers throw away fresh food they</text><text x="84" y="1498" font-size="34" font-weight="600" fill="#141414" text-anchor="start">paid for.</text><text x="84" y="1626" font-size="120" font-weight="600" fill="url(#g)">8%</text><text x="84" y="1672" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">of fresh stock binned at a pilot store</text><rect x="84.0" y="1700.0" width="288.2" height="44.0" rx="22.0" fill="#F4F2EE"/><text x="228.1025390625" y="1732.08" font-size="28" font-weight="600" fill="#141414" text-anchor="middle">updated Nov 2026</text><text x="308.138671875" y="1361" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">designed, animated, one story</text></svg>