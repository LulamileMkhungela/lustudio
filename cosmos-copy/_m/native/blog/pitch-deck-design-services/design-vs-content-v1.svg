<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1001" viewBox="0 0 1600 1001" role="img" aria-labelledby="t d"><title id="t">Design gets you read. Content gets you funded.</title><desc id="d">Chart of the Blaseg and Mayer 2025 trial. Better design and better content each raised time spent by 35% and slides viewed by 12%; positive reactions rose 116% for design and 121% for content. Only better content raised the likelihood to invest.</desc><defs><style>@font-face{font-family:'InterSub';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'InterSub';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:InterSub,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6FB5"/><stop offset="0.5" stop-color="#FFB86B"/><stop offset="1" stop-color="#8FD8FF"/></linearGradient><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2B"/><stop offset="1" stop-color="#2B2B2B" stop-opacity="0"/></linearGradient></defs><rect width="1600" height="1001" rx="28" fill="#F4F2EE"/><rect x="24" y="24" width="1552" height="953" rx="22" fill="#FFFFFF"/><text x="72" y="108" font-size="46" font-weight="600" fill="#141414" text-anchor="start">Design gets you read. Content gets you funded.</text><text x="72" y="158" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">Blaseg and Mayer, 2025: randomized trial with nearly 35,000 investors.</text><line x1="620.0" y1="258" x2="620.0" y2="808" stroke="#E4E0DA" stroke-width="2"/><line x1="770.0" y1="258" x2="770.0" y2="808" stroke="#E4E0DA" stroke-width="2"/><line x1="920.0" y1="258" x2="920.0" y2="808" stroke="#E4E0DA" stroke-width="2"/><line x1="1070.0" y1="258" x2="1070.0" y2="808" stroke="#E4E0DA" stroke-width="2"/><line x1="1220.0" y1="258" x2="1220.0" y2="808" stroke="#E4E0DA" stroke-width="2"/><rect x="72.0" y="190.0" width="36.0" height="26.0" rx="6" fill="url(#g)"/><text x="122" y="214" font-size="27" font-weight="400" fill="#141414" text-anchor="start">Better design</text><rect x="336.1" y="190.0" width="36.0" height="26.0" rx="6" fill="#2B2B2B"/><text x="386.1474609375" y="214" font-size="27" font-weight="400" fill="#141414" text-anchor="start">Better content</text><text x="72" y="320" font-size="29" font-weight="600" fill="#141414" text-anchor="start">Time spent on the deck</text><rect x="620.0" y="276.0" width="210.0" height="40.0" rx="9" fill="url(#g)"/><text x="844.0" y="308" font-size="30" font-weight="600" fill="#141414" text-anchor="start">+35%</text><rect x="620.0" y="330.0" width="210.0" height="40.0" rx="9" fill="#2B2B2B"/><text x="844.0" y="362" font-size="30" font-weight="600" fill="#141414" text-anchor="start">+35%</text><text x="72" y="460" font-size="29" font-weight="600" fill="#141414" text-anchor="start">Slides viewed</text><rect x="620.0" y="416.0" width="72.0" height="40.0" rx="9" fill="url(#g)"/><text x="706.0" y="448" font-size="30" font-weight="600" fill="#141414" text-anchor="start">+12%</text><rect x="620.0" y="470.0" width="72.0" height="40.0" rx="9" fill="#2B2B2B"/><text x="706.0" y="502" font-size="30" font-weight="600" fill="#141414" text-anchor="start">+12%</text><text x="72" y="600" font-size="29" font-weight="600" fill="#141414" text-anchor="start">Positive reactions</text><rect x="620.0" y="556.0" width="696.0" height="40.0" rx="9" fill="url(#g)"/><text x="1330.0" y="588" font-size="30" font-weight="600" fill="#141414" text-anchor="start">+116%</text><rect x="620.0" y="610.0" width="726.0" height="40.0" rx="9" fill="#2B2B2B"/><text x="1360.0" y="642" font-size="30" font-weight="600" fill="#141414" text-anchor="start">+121%</text><text x="72" y="740" font-size="29" font-weight="600" fill="#141414" text-anchor="start">Likelihood to invest</text><rect x="620.0" y="696.0" width="300.0" height="40.0" rx="9" fill="#FFFFFF" stroke="#5E5B57" stroke-width="2" stroke-dasharray="8 8"/><text x="770" y="728" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="middle">no effect found</text><rect x="620.0" y="750.0" width="300.0" height="40.0" rx="9" fill="#2B2B2B"/><text x="770" y="782" font-size="27" font-weight="600" fill="#FFFFFF" text-anchor="middle">increased</text><text x="620.0" y="844" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="middle">0%</text><text x="770.0" y="844" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="middle">25%</text><text x="920.0" y="844" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="middle">50%</text><text x="1070.0" y="844" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="middle">75%</text><text x="1220.0" y="844" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="middle">100%</text><text x="72" y="904" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">Source: Blaseg and Mayer, Content vs. Design in Startup Pitch Decks, Academy of Management Annual Meeting</text><text x="72" y="941" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">2025.</text></svg>