<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="796" viewBox="0 0 1600 796" role="img" aria-labelledby="t d"><title id="t">Rule 6: show the plan, not only the product</title><desc id="d">A made-up ask slide for the fictional startup Kelvadore Foods: a $1.5 million seed round, split 50% product, 30% sales, 20% operations, with milestones at months 6, 12 and 18.</desc><defs><style>@font-face{font-family:'InterSub';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'InterSub';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:InterSub,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6FB5"/><stop offset="0.5" stop-color="#FFB86B"/><stop offset="1" stop-color="#8FD8FF"/></linearGradient><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2B2B"/><stop offset="1" stop-color="#2B2B2B" stop-opacity="0"/></linearGradient></defs><rect width="1600" height="796" rx="28" fill="#F4F2EE"/><rect x="24" y="24" width="1552" height="748" rx="22" fill="#FFFFFF"/><text x="72" y="108" font-size="46" font-weight="600" fill="#141414" text-anchor="start">Rule 6: show the plan, not only the product</text><text x="72" y="158" font-size="28" font-weight="400" fill="#5E5B57" text-anchor="start">A made-up ask slide for Kelvadore Foods, the fictional startup used below.</text><rect x="72.0" y="218.0" width="1456.0" height="450.0" rx="16" fill="#FFFFFF" stroke="#E4E0DA" stroke-width="2"/><text x="120" y="302" font-size="40" font-weight="600" fill="#141414" text-anchor="start">$1.5M seed takes us to 60 stores in 18 months</text><text x="120" y="386" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">Where the money goes</text><rect x="120.0" y="410.0" width="300.0" height="64.0" rx="8" fill="#2B2B2B"/><text x="270.0" y="453" font-size="30" font-weight="600" fill="#FFFFFF" text-anchor="middle">50%</text><rect x="420.0" y="410.0" width="180.0" height="64.0" rx="8" fill="#8C8882"/><text x="510.0" y="453" font-size="30" font-weight="600" fill="#FFFFFF" text-anchor="middle">30%</text><rect x="600.0" y="410.0" width="120.0" height="64.0" rx="8" fill="#B9B4AD"/><text x="660.0" y="453" font-size="30" font-weight="600" fill="#141414" text-anchor="middle">20%</text><rect x="120.0" y="512.0" width="28.0" height="28.0" rx="7" fill="#2B2B2B"/><text x="164" y="534" font-size="29" font-weight="600" fill="#141414" text-anchor="start">Product</text><text x="288.85986328125" y="534" font-size="29" font-weight="400" fill="#5E5B57" text-anchor="start">50%</text><rect x="120.0" y="558.0" width="28.0" height="28.0" rx="7" fill="#8C8882"/><text x="164" y="580" font-size="29" font-weight="600" fill="#141414" text-anchor="start">Sales</text><text x="254.181640625" y="580" font-size="29" font-weight="400" fill="#5E5B57" text-anchor="start">30%</text><rect x="120.0" y="604.0" width="28.0" height="28.0" rx="7" fill="#B9B4AD"/><text x="164" y="626" font-size="29" font-weight="600" fill="#141414" text-anchor="start">Operations</text><text x="332.85546875" y="626" font-size="29" font-weight="400" fill="#5E5B57" text-anchor="start">20%</text><text x="790" y="386" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">Milestones</text><line x1="790" y1="442" x2="1282" y2="442" stroke="#B9B4AD" stroke-width="3"/><circle cx="802" cy="442" r="12" fill="#2B2B2B"/><text x="790" y="502" font-size="29" font-weight="600" fill="#141414" text-anchor="start">Month 6</text><text x="790" y="544" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">24 → 40 stores</text><circle cx="1042" cy="442" r="12" fill="#2B2B2B"/><text x="1030" y="502" font-size="29" font-weight="600" fill="#141414" text-anchor="start">Month 12</text><text x="1030" y="544" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">$1M ARR</text><circle cx="1282" cy="442" r="12" fill="url(#g)"/><text x="1270" y="502" font-size="29" font-weight="600" fill="#141414" text-anchor="start">Month 18</text><text x="1270" y="544" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">60 stores,</text><text x="1270" y="580" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="start">Series A ready</text><line x1="340" y1="674" x2="340" y2="694" stroke="#141414" stroke-width="3"/><text x="340" y="734" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="middle">what the round pays for</text><line x1="960" y1="674" x2="960" y2="694" stroke="#141414" stroke-width="3"/><text x="960" y="734" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="middle">which milestones it reaches</text><line x1="1330" y1="674" x2="1330" y2="694" stroke="#141414" stroke-width="3"/><text x="1330" y="734" font-size="27" font-weight="400" fill="#5E5B57" text-anchor="middle">how it becomes a return</text></svg>